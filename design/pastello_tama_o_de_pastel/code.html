<script>
        // Simple micro-interaction for size selection and price update
        const radios = document.querySelectorAll('input[name="cake-size"]');
        const priceDisplay = document.getElementById('total-price');

        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                const card = e.target.nextElementSibling;
                const price = card.querySelector('.text-secondary').innerText;
                priceDisplay.innerText = `${price}.00`;
                
                // Visual feedback
                card.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    card.style.transform = 'scale(1)';
                }, 150);
            });
        });

        // Hover effect for cards to add some "creamy" movement
        document.querySelectorAll('.group').forEach(el => {
            el.addEventListener('mouseenter', () => {
                el.style.animation = 'soft-bounce 1.5s infinite ease-in-out';
            });
            el.addEventListener('mouseleave', () => {
                el.style.animation = 'none';
            });
        });
    </script>
